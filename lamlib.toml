[library]
name = "@lam/vulture/tus-plugin"
version = "1.0.0"
description = "tus 1.0 resumable-upload plugin for @lam/vulture"
license = "Apache-2.0"
authors = ["Lammergeier contributors"]
repository = "https://github.com/thallium-solutions/lam-vulture-tus-plugin"
homepage = "https://github.com/thallium-solutions/lam-vulture-tus-plugin"

[compatibility]
lamc = "^1.17"

[dependencies]
"@lam/vulture" = { git = "https://github.com/thallium-solutions/lam-vulture.git", ref = "v1.0.0" }

[go-deps]
"github.com/google/uuid" = "v1.6.0"

[scripts]
test = "python3 tests/run_tests.py --verbose"
format = "lamc fmt ."
check = "lamc fmt . --check"
